<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布窗口冲突检查台</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2329; --muted:#6b7280; --line:#e3e6ea; --ok:#0a7d43; --err:#c0392b; --warn:#b26a00; --accent:#2f5fd7; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  textarea { width:100%; min-height: 180px; padding:10px; border:1px solid var(--line); border-radius:8px; font:13px/1.5 ui-monospace,Consolas,monospace; resize:vertical; background:#fbfcfe; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  button { padding:8px 16px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font-size:14px; cursor:pointer; }
  button:hover { background:#f0f3fa; border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#264bb0; }
  .counts { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .pill { flex:1 1 120px; background:#fbfcfe; border:1px solid var(--line); border-radius:8px; padding:8px 12px; text-align:center; }
  .pill b { display:block; font-size:20px; }
  .pill.ok b { color:var(--ok); } .pill.err b { color:var(--err); } .pill.warn b { color:var(--warn); }
  .pill span { color:var(--muted); font-size:12px; }
  h2 { font-size:15px; margin:14px 0 6px; }
  .list { border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .list:empty { display:none; }
  .item { padding:8px 12px; border-bottom:1px solid var(--line); white-space:pre-wrap; word-break:break-all; font-size:13px; }
  .item:last-child { border-bottom:none; }
  .item.e { background:#fdf3f2; } .item.c { background:#fff8ec; } .item.v { background:#f4faf6; }
  .tip { color:var(--muted); font-size:12px; margin-top:8px; }
  @media (max-width: 560px) {
    body { padding:10px; }
    .card { padding:10px; }
    textarea { min-height: 150px; }
    button { flex:1 1 40%; padding:10px 8px; }
    .pill { flex:1 1 44%; }
    h1 { font-size:18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>发布窗口冲突检查台</h1>
  <p class="sub">粘贴 TSV（每行：服务名 → Tab → 开始时间 → Tab → 结束时间），时间为北京时间 YYYY-MM-DD HH:mm。同名服务按半开区间比较，端点相接不算冲突。</p>

  <div class="card">
    <label for="input">输入（TSV，服务名、开始、结束）</label>
    <textarea id="input" spellcheck="false" placeholder="服务A&#9;2026-11-24 09:00&#9;2026-11-24 10:30"></textarea>
    <div class="btns">
      <button class="primary" id="btnCheck">检查</button>
      <button id="btnSample">示例</button>
      <button id="btnClear">清空</button>
      <button id="btnCopy">复制结果</button>
    </div>
    <p class="tip">最多 300 个非空行。空行自动忽略，日期按公历校验。清单只在当前页面处理。</p>
    <p class="tip" id="copyStatus" role="status" hidden></p>
    <textarea id="copyFallback" aria-label="可手动复制的检查结果" readonly hidden></textarea>
  </div>

  <div class="card">
    <div class="counts">
      <div class="pill ok"><b id="cValid">0</b><span>有效行</span></div>
      <div class="pill err"><b id="cErr">0</b><span>错误</span></div>
      <div class="pill warn"><b id="cConflict">0</b><span>冲突</span></div>
    </div>
    <h2>冲突（同名服务窗口重叠）</h2>
    <div class="list" id="conflictList"></div>
    <h2>错误行</h2>
    <div class="list" id="errorList"></div>
    <h2>有效行</h2>
    <div class="list" id="validList"></div>
  </div>
</div>

<script id="core">
function analyze(input) {
  var errors = [], valid = [], conflicts = [];
  var lines = String(input).split(/\r\n|\r|\n/);
  var rows = [];
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].trim() !== '') rows.push({ line: i + 1, text: lines[i] });
  }
  if (rows.length === 0) return { valid: valid, errors: errors, conflicts: conflicts };
  if (rows.length > 300) {
    errors.push({ line: null, msg: '非空行共 ' + rows.length + ' 行，超过上限 300 行。' });
    return { valid: valid, errors: errors, conflicts: conflicts };
  }
  var re = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/;
  function parseTime(s) {
    var m = re.exec(s);
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3], h = +m[4], mi = +m[5];
    if (y === 0) return null;
    var dt = new Date(0);
    dt.setUTCFullYear(y, mo - 1, d);
    dt.setUTCHours(h, mi, 0, 0);
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d ||
        dt.getUTCHours() !== h || dt.getUTCMinutes() !== mi) return null;
    return dt.getTime() / 60000;
  }
  for (var j = 0; j < rows.length; j++) {
    var ln = rows[j].line, raw = rows[j].text;
    var parts = raw.split('\t');
    if (parts.length !== 3) {
      errors.push({ line: ln, text: raw, msg: '应为 3 列（服务名、开始、结束，以 Tab 分隔），实际 ' + parts.length + ' 列。' });
      continue;
    }
    var name = parts[0].trim();
    if (!name) { errors.push({ line: ln, text: raw, msg: '服务名不能为空。' }); continue; }
    var s = parseTime(parts[1].trim());
    if (s === null) { errors.push({ line: ln, text: raw, msg: '开始时间无效：需为真实日期时间 YYYY-MM-DD HH:mm。' }); continue; }
    var e = parseTime(parts[2].trim());
    if (e === null) { errors.push({ line: ln, text: raw, msg: '结束时间无效：需为真实日期时间 YYYY-MM-DD HH:mm。' }); continue; }
    if (e <= s) { errors.push({ line: ln, text: raw, msg: '结束时间必须晚于开始时间。' }); continue; }
    valid.push({ line: ln, name: name, start: s, end: e });
  }
  for (var a = 0; a < valid.length; a++) {
    for (var b = a + 1; b < valid.length; b++) {
      var A = valid[a], B = valid[b];
      if (A.name !== B.name) continue;
      if (A.start < B.end && B.start < A.end) {
        var ov = Math.min(A.end, B.end) - Math.max(A.start, B.start);
        conflicts.push({ a: A, b: B, minutes: ov });
      }
    }
  }
  conflicts.sort(function (x, y) { return x.a.start - y.a.start || x.b.start - y.b.start; });
  return { valid: valid, errors: errors, conflicts: conflicts };
}
if (typeof module !== 'undefined' && module.exports) module.exports = { analyze: analyze };
</script>

<script>
(function () {
  var input = document.getElementById('input');
  var cValid = document.getElementById('cValid');
  var cErr = document.getElementById('cErr');
  var cConflict = document.getElementById('cConflict');
  var conflictList = document.getElementById('conflictList');
  var errorList = document.getElementById('errorList');
  var validList = document.getElementById('validList');
  var copyStatus = document.getElementById('copyStatus');
  var copyFallback = document.getElementById('copyFallback');
  var lastResultText = '';

  function render(result) {
    cValid.textContent = String(result.valid.length);
    cErr.textContent = String(result.errors.length);
    cConflict.textContent = String(result.conflicts.length);
    conflictList.textContent = '';
    errorList.textContent = '';
    validList.textContent = '';
    copyStatus.hidden = true;
    copyFallback.hidden = true;
    copyFallback.value = '';
    var parts = ['发布窗口冲突检查结果', '有效 ' + result.valid.length + ' 行，错误 ' + result.errors.length + ' 行，冲突 ' + result.conflicts.length + ' 对'];

    result.conflicts.forEach(function (c) {
      var div = document.createElement('div');
      div.className = 'item c';
      div.textContent = '第 ' + c.a.line + ' 行与第 ' + c.b.line + ' 行（' + c.a.name + '）重叠 ' + c.minutes +
        ' 分钟：' + fmt(Math.max(c.a.start, c.b.start)) + ' 至 ' + fmt(Math.min(c.a.end, c.b.end));
      conflictList.appendChild(div);
      parts.push(div.textContent);
    });
    if (!result.conflicts.length) {
      var ok = document.createElement('div');
      ok.className = 'item';
      ok.textContent = '无冲突。';
      conflictList.appendChild(ok);
    }

    result.errors.forEach(function (e) {
      var div = document.createElement('div');
      div.className = 'item e';
      div.textContent = (e.line ? '第 ' + e.line + ' 行：' : '') + e.msg + (e.text === undefined ? '' : ' 原文：' + e.text);
      errorList.appendChild(div);
      parts.push(div.textContent);
    });
    if (!result.errors.length) {
      var ok2 = document.createElement('div');
      ok2.className = 'item';
      ok2.textContent = '无错误行。';
      errorList.appendChild(ok2);
    }

    result.valid.forEach(function (v) {
      var div = document.createElement('div');
      div.className = 'item v';
      div.textContent = '第 ' + v.line + ' 行  ' + v.name + '  ' + fmt(v.start) + ' ~ ' + fmt(v.end) + '（' + (v.end - v.start) + ' 分钟）';
      validList.appendChild(div);
      parts.push(div.textContent);
    });
    if (!result.valid.length) {
      var ok3 = document.createElement('div');
      ok3.className = 'item';
      ok3.textContent = '无有效行。';
      validList.appendChild(ok3);
    }
    lastResultText = parts.join('\n');
  }

  function fmt(mins) {
    var d = new Date(mins * 60000);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return String(d.getUTCFullYear()).padStart(4, '0') + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) + ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
  }

  document.getElementById('btnCheck').addEventListener('click', function () {
    render(analyze(input.value));
  });

  document.getElementById('btnSample').addEventListener('click', function () {
    input.value = [
      '示例网关\t2026-11-24 09:00\t2026-11-24 10:30',
      '示例网关\t2026-11-24 10:00\t2026-11-24 11:00',
      '示例网关\t2026-11-24 11:00\t2026-11-24 12:00',
      '示例索引\t2026-11-24 10:00\t2026-11-24 11:00',
      '示例队列\t2026-02-30 08:00\t2026-02-30 09:00'
    ].join('\n');
    render(analyze(input.value));
  });

  document.getElementById('btnClear').addEventListener('click', function () {
    input.value = '';
    render(analyze(''));
    lastResultText = '';
    input.focus();
  });

  document.getElementById('btnCopy').addEventListener('click', async function () {
    copyStatus.hidden = false;
    copyFallback.hidden = true;
    if (!lastResultText) { copyStatus.textContent = '请先检查发布窗口。'; return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(lastResultText);
        copyStatus.textContent = '已复制检查结果。';
        return;
      } catch (_error) { /* Allow manual copy when clipboard access is denied. */ }
    }
    copyStatus.textContent = '浏览器无法自动复制。请手动复制下面已选中的结果。';
    copyFallback.hidden = false;
    copyFallback.value = lastResultText;
    copyFallback.focus();
    copyFallback.select();
  });
})();
</script>
</body>
</html>
